name: release

on:
  push:
    branches: [main]

permissions:
  contents: write # commit the release back to main + tags + GitHub releases
  id-token: write # npm provenance

env:
  # Skip gracefully (green no-op) until NPM_TOKEN is configured, instead of
  # failing verification on a run that would release nothing anyway.
  HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    if: env.HAS_NPM_TOKEN == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Test suite
        run: uv run --with pytest pytest -q tests/

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: semantic-release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
