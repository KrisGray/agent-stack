name: release

on:
  push:
    branches: [main]
  workflow_dispatch: # manual re-trigger for transient failures

permissions:
  contents: write # commit the release back to main + tags + GitHub releases
  id-token: write # npm trusted publishing (OIDC) + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # full history + tags: semantic-release finds the previous release tag
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: astral-sh/setup-uv@v5

      - name: Test suite
        run: uv run --with pytest pytest -q tests/

      # No registry-url: it exists for token auth (writes a legacy
      # .npmrc with always-auth, which npm >= 11 warns about) and OIDC
      # trusted publishing needs none of it.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # OIDC trusted publishing requires npm >= 11.5
      - name: Latest npm
        run: npm install -g npm@latest

      # Bootstrap gate: trusted publishing can only be registered once the
      # package exists on npm. Skip green until the seed release is published
      # by hand; this gate turns itself off the moment the package appears.
      - name: Package exists on npm?
        id: on_npm
        run: |
          if npm view pi-agent-stack version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "pi-agent-stack is not on npm yet — publish the seed release by hand, then register the trusted publisher. Skipping."
          fi

      # Install the local tree so semantic-release resolves from
      # node_modules (its changelog/git plugins are devDependencies).
      - name: Install dependencies
        if: steps.on_npm.outputs.exists == 'true'
        run: npm ci

      - name: semantic-release
        if: steps.on_npm.outputs.exists == 'true'
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
