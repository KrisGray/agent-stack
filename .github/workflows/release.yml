name: release

on:
  push:
    branches: [main]
  workflow_dispatch: # manual re-trigger for transient failures

permissions:
  contents: write # commit the release back to main + tags + GitHub releases
  id-token: write # npm trusted publishing (OIDC) + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Test suite
        run: uv run --with pytest pytest -q tests/

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # OIDC trusted publishing requires npm >= 11.5
      - name: Latest npm
        run: npm install -g npm@latest

      # Bootstrap gate: trusted publishing can only be registered once the
      # package exists on npm. Skip green until the seed release is published
      # by hand; this gate turns itself off the moment the package appears.
      - name: Package exists on npm?
        id: on_npm
        run: |
          if npm view pi-agent-stack version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "pi-agent-stack is not on npm yet — publish the seed release by hand, then register the trusted publisher. Skipping."
          fi

      # semantic-release does not bundle its changelog/git plugins.
      # --no-save keeps package.json lean for consumers.
      - name: Install release plugins
        if: steps.on_npm.outputs.exists == 'true'
        run: npm install --no-save @semantic-release/changelog @semantic-release/git

      - name: semantic-release
        if: steps.on_npm.outputs.exists == 'true'
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
