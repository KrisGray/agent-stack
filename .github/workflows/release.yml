name: release

on:
  push:
    branches: [main]

permissions:
  contents: write # commit the release back to main + tags + GitHub releases
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # Job-level env may reference secrets; workflow-level may not.
      # Skips publishing (green) until NPM_TOKEN is configured.
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Test suite
        run: uv run --with pytest pytest -q tests/

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # OIDC trusted publishing requires npm >= 11.5
      - name: Latest npm
        run: npm install -g npm@latest

      - name: semantic-release
        if: env.HAS_NPM_TOKEN == 'true'
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
